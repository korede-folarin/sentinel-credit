# Sentinel Credit v2 settings (v2 Engineering Decision Log).
# Separate from config.yaml so v1's sections are never edited; v2 READS the
# v1 values it must share (business cutoff, splits, features) from config.yaml
# and the frozen v1 model package.

phase1:
  # Plain English: one MLflow experiment per v2 phase, every run tagged with
  # the dataset it used.
  mlflow_experiment: "sentinel_v2_phase1_pytorch"
  # The challenger is trained and judged on the v1 dataset (the same data
  # as the champion), so it carries the champion's dataset_version value.
  dataset_version: "full_horizon_2025_v1"
  model_version: "v2-phase1"
  # Separate registry entry: the v1 entry (sentinel_credit_champion) is
  # never touched.
  registered_model_name: "sentinel_credit_v2_challengers"
  results_schema: "v2_results"
  artifacts_dir: "v2/artifacts/phase1"
  reports_dir: "v2/reports/phase1"
  random_seed: 42

  mlp:
    # Small, fixed search (owner's choice: avoid heavy tuning, overfitting
    # risk). Chosen by 5-fold cross-validated AUC on the TRAINING partition
    # only; test and out-of-time data are untouched until final evaluation.
    candidates:
      - {hidden: [32], dropout: 0.1}
      - {hidden: [64, 32], dropout: 0.2}
      - {hidden: [128, 64], dropout: 0.3}
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 256
    max_epochs: 100
    # Early stopping on a stratified 15% slice of the data each fit sees.
    validation_fraction: 0.15
    patience: 8

  autoencoder:
    # Trained on non-defaulters in the training partition only ("normal
    # behaviour"); reconstruction error is then compared with default.
    hidden: [8, 4]
    learning_rate: 0.001
    batch_size: 256
    max_epochs: 100
    validation_fraction: 0.15
    patience: 8

  explain:
    # Captum Integrated Gradients on the uncalibrated network, over a fixed
    # sample of the stratified test set, baseline = the training mean.
    sample_size: 2000
    n_steps: 50

phase4:
  # Plain English: replay the v1 synthetic history as a live event stream
  # (Kafka), keep each customer's features up to date inside Flink, and
  # score every application with the unchanged v1.1 champion. Simulated
  # stream only: no real customers, no live traffic.
  dataset_version: "full_horizon_2025_v1"   # the events come from v1's raw tables
  model_version: "v2-phase4-stream"
  results_schema: "v2_stream"
  # Shadow mode: decisions are logged, never returned to anyone. The v1 API
  # stays the system of record (ground rule: consumers read v1 until v2 is
  # validated).
  mode: "shadow"
  kafka:
    events_topic: "sentinel.v2.events"
    scores_topic: "sentinel.v2.scores"
    partitions: 4
  flink:
    # = the TaskManager's slots (flink-conf/config.yaml). Chosen by measured
    # throughput (V2-03); run stream_1000eps_r1 used 2 and fell behind.
    parallelism: 8
    checkpoint_interval_ms: 10000
    # Event time: an event may arrive up to this late and still be put in
    # order. Anything later is applied straight away and flagged "late".
    watermark_out_of_orderness_ms: 2000
  simulator:
    seed: 42
    duplicate_rate: 0.01        # 1% of events are sent twice
    late_rate: 0.02             # 2% of events are delivered late...
    late_min_s: 1
    late_max_s: 600             # ...by up to 10 minutes
    duplicate_max_delay_s: 5
  # Runs reported in V2-03: rate (events per second) and how many customers'
  # full histories are replayed (every event for each chosen customer, so the
  # final state can be compared with the v1 feature store).
  runs:
    - {rate: 10, customers: 400}
    - {rate: 100, customers: 4000}
    - {rate: 1000, customers: 50000}
  parity_tolerance: 1.0e-9
  audit_dir: "v2/streaming/audit"

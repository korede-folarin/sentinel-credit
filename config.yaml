
project:
  name: "Sentinel Credit — BNPL Risk Intelligence Platform"
  version: "1.0.0"

data_generator:
  n_customers: 50000
  random_seed: 42
  output_dir: "data_generator/output"

  # ── OBSERVATION WINDOWS ──────────────────────────────
  # See engineering_decision_log.md — Decision 1a.
  start_date: "2022-01-01"
  origination_end_date: "2024-10-31"
  data_end_date: "2025-12-31"   

  # ── DEFAULT DEFINITION ───────────────────────────────
  # 90 DPD on the oldest unpaid instalment. CRR/EBA aligned
  # in principle. 30 DPD retained as an IFRS 9 style credit
  # risk indicator, not as default. See Decision 1a.
  default_dpd_threshold: 90
  sicr_dpd_threshold: 30

  # ── POPULATION ───────────────────────────────────────
  # Prevalences reference published UK figures. Sources and
  # reasoning in docs/project_rationale.md — Synthetic Data Calibration Assumptions.
  vulnerability_prevalence: 0.24
  thin_file_prevalence: 0.31
  # Consumer Duty flagging only. Never a model input.
  mental_health_prevalence: 0.17

  age_distribution:
    "18-25": 0.19
    "26-35": 0.33
    "36-45": 0.23
    "46-55": 0.15
    "56+":   0.10

  age_ranges:
    "18-25": [18, 25]
    "26-35": [26, 35]
    "36-45": [36, 45]
    "46-55": [46, 55]
    "56+":   [56, 80]

  income_bands:
    "Under £15k":  0.17
    "£15k-£25k":   0.26
    "£25k-£35k":   0.24
    "£35k-£50k":   0.18
    "£50k-£75k":   0.10
    "Over £75k":   0.05

  merchant_categories:
    "Fashion & Clothing": 0.30
    "Electronics":        0.17
    "Home":               0.15
    "Health & Beauty":    0.12
    "Sports":             0.10
    "Travel":             0.07
    "Food & Grocery":     0.06
    "Other":              0.03

  # Range anchored to a published delinquency spread.
  merchant_risk:
    "Food & Grocery":     0.50
    "Health & Beauty":    0.65
    "Sports":             0.80
    "Other":              1.00
    "Home":               1.20
    "Fashion & Clothing": 1.50
    "Electronics":        2.00
    "Travel":             2.50

  # ── INSTALMENT PLANS ─────────────────────────────────
  # Pay in 3 plus 6 and 12 month plans. Category split is a
  # design assumption, loose not deterministic. Decision 1a.
  instalment_plans_by_category:
    "Home":               {3: 0.70, 6: 0.20, 12: 0.10}
    "Electronics":        {3: 0.75, 6: 0.17, 12: 0.08}
    "Travel":             {3: 0.80, 6: 0.14, 12: 0.06}
    "Fashion & Clothing": {3: 0.95, 6: 0.04, 12: 0.01}
    "Health & Beauty":    {3: 0.96, 6: 0.03, 12: 0.01}
    "Sports":             {3: 0.94, 6: 0.05, 12: 0.01}
    "Other":              {3: 0.93, 6: 0.05, 12: 0.02}
    # Essentials capped at Pay in 3 per Woolard Review.
    "Food & Grocery":     {3: 1.00}

  # ── REPAYMENT HAZARD PROCESS ─────────────────────────
  # Default emerges from repayment behaviour, never assigned.
  # Values calibrated by sweep. See Decision 1a.
  repayment_process:
      
    base_miss_hazard: 0.005

    # Calibration multiplier on the arrears cure probabilities.
    cure_scale: 1.30

    # Capacity to recover, distinct from likelihood of missing.
    resilience_weights:
      savings_buffer:            0.45
      disposable_income_buffer:  0.40
      employment_stability:      0.15

    # Arrears depth: [full_cure, partial_cure, no_payment]
    arrears_resolution:
      1: [0.75, 0.00, 0.25]
      2: [0.35, 0.40, 0.25]
      3: [0.12, 0.55, 0.33]
      4: [0.04, 0.56, 0.40]

    # Cure chances halve every N days the oldest arrear ages.
    dpd_decay_halflife: 45

    # Payments clear the oldest unpaid instalment first.
    payment_allocation: "oldest_due_first"

  # ── A/B TEST ─────────────────────────────────────────
  # Strict 0.45 vs relaxed 0.60 affordability threshold.
  # Uplift powered for 80% at 5% significance. Decision 1.
  ab_test:
    group_A_size:           0.50
    group_B_size:           0.50
    # Group B approves at a looser affordability threshold,
    # so its customers miss payments more often. Applied to
    # the miss hazard, since default is emergent rather than
    # assigned. Calibrated to produce a detectable difference.
    group_B_hazard_multiplier: 1.60
    strict_threshold:       0.45
    relaxed_threshold:      0.60


validation:
  # ── FIDELITY ──────────────────────────────────────────
 
  hellinger_threshold: 0.05

  
  prevalence_tolerance: 0.01

  # ── UTILITY ───────────────────────────────────────────
 
  gini_tolerance: 0.05

  # ── PRIVACY ───────────────────────────────────────────

  singling_out_threshold: 0.20     # max acceptable unique-record rate
  near_duplicate_threshold: 0.01   # max acceptable near-duplicate rate

  # ── PLANNED, NOT YET IMPLEMENTED ──────────────────────

  n_runs: 5
  ks_threshold: 0.05

  reports_dir: "validation/reports"

eda_thresholds:
  # Standard credit-scoring convention (Siddiqi, Credit Risk
  # Scorecards), not derived from this dataset — unlike
  # hellinger_threshold, which is anchored to observed scores.
  # IV < 0.02 no signal; 0.02-0.3 usable; > 0.5 investigate
  # for leakage before including the feature.
  iv_drop_threshold: 0.02
  iv_leakage_threshold: 0.50

  # Conventional multicollinearity flag for regression models.
  vif_threshold: 10.0

  # Flags feature pairs worth reviewing before modelling.
  correlation_threshold: 0.70

  # Standard Tukey IQR multiplier for outlier flagging.
  outlier_iqr_multiplier: 1.5


database:
  # PostgreSQL connection details. Password is never stored
  # here — read from the SENTINEL_DB_PASSWORD environment
  # variable at runtime (see eda_baseline.py / eda_exploration.ipynb).
  host: "localhost"
  port: 5432
  name: "sentinel_credit"
  schema: "feature_store"

model:
  test_size: 0.2
  random_seed: 42

  # Business cutoff is a configurable POLICY parameter belonging
  # to the decision engine, not a property of any individual model.
  #
  # v1.1 (13 features, Decision 27): recalibrated on promotion, same
  # method as Decision 19: training-only calibrated out-of-fold
  # predictions from the champion, 15% review-capacity constraint
  # (still a placeholder figure). Threshold 0.0657, capturing 50.11%
  # of observed defaults at 9.09% precision in the OOF population.
  # F1-optimal (0.0764) and Youden (0.0400) retained as comparators.
  #
  # v1 (14 features, August 2026) used 0.0671 (51.55% / 9.35%).
  # Restore it together with the v1 identity on any rollback.
  #
  # Any future champion promotion requires threshold
  # recalibration because score distributions differ by model.
  # See Decisions 19 and 27.
  business_cutoff: 0.0657

  # Affordability limit (Decision 35, owner's choice): applications whose
  # FCA CONC 5.2A ratio, (existing monthly commitments + this instalment)
  # / monthly income, is above this are declined, as the project's own
  # application process does (data_generator ab_test). 0.45 is the
  # strict threshold: its customers defaulted at 0.65% vs 1.15% under
  # the relaxed 0.60 (Decisions 15-16).
  affordability_limit: 0.45

  # Out-of-time split, in use: first_transaction_date >= this
  # date is the temporal test set (4,857 customers, 124 defaults
  # since the Decision 16 horizon extension). An earlier note here
  # said it produced a single-class test set and was skipped; that
  # was true only before Decision 16 and no longer applies.
  # Caveat: about 79% of these customers are also in the
  # stratified training partition, which matters when this split
  # is reused as a drift comparison population (audit A2).
  # See Decision 10 addendum (tenor-maturity bias).
  split_strategy: "temporal"
  temporal_split_date: "2024-09-01"



mlflow:
  tracking_uri: "file:./mlruns"
  experiment_name: "sentinel_credit_baseline"

model_governance:
  # IDENTITY VALUES, stamped into the champion package's
  # champion_metadata.json at training time. explain_models.py and
  # govern_model_features.py refuse to run if these differ from the
  # saved champion, so change them only together with a retrain.
  # (Audit B9.)
  champion_model: "xgboost"
  # Where the governed champion package lives. Every script and the
  # scoring API read the champion from here. Each champion gets its own
  # folder and older ones are never overwritten (train_baseline_models.py
  # refuses to write into a folder holding a different identity).
  #
  # ROLLBACK to the August 2026 v1 (14-feature) champion: set
  #   artifacts_dir "models/artifacts", model_version "v1",
  #   feature_set_label "14_features_v1_frozen",
  #   pipeline_stage "post_scope_decision_pending_retrain",
  #   decision_log_version "3.20", model.business_cutoff 0.0671,
  # restore pct_late_payments to MODEL_FEATURES (git e42c108), and
  # move the registry 'champion' alias back to v1's run.
  # See Decision 27.
  artifacts_dir: "models/artifacts_v1_1"
  model_version: "v1.1"
  dataset_version: "full_horizon_2025_v1"
  feature_set_label: "13_features_v1_1"
  pipeline_stage: "v1_1_validity_promotion"
  decision_log_version: "3.27"


  
explainability:
  split: "stratified"
  n_top_dependence: 4
  strategic_dependence_features:
    - "credit_score"
    - "thin_file_flag"
    - "max_affordability_ratio"
  additivity_tolerance: 0.0001
  mlflow_artifact_path: "shap"

  # Decision 31: error-type checks, explanation genre, risk officer flag.
  # The numbers below are OUR CHOICES, not research findings. Every
  # data-derived limit (training ranges, consistency limits, the blind-spot
  # score line, the "people like you" bands) is computed from the champion's
  # training partition by models/build_explanation_rules.py and written to
  # serving/explanation_rules.json. Re-run it after any promotion.
  decision_review:
    rules_version: "1.0"
    # Established-file applicants (thin_file_flag = 0) are the model's known
    # blind spot: at the cutoff their false-negative rate is 100%. Those
    # scoring at or above this percentile of their own group's training
    # out-of-fold scores are sent for risk officer review.
    blind_spot_percentile: 0.95
    # Over-reliance: the recommendation rests on one detail when setting
    # that detail alone to typical would change the recommendation AND it
    # carries at least this share of the total absolute effect.
    single_detail_share: 0.6
    # The data-input check flags model inputs outside the training range.
    # Training never held exactly £0 savings (min £7.92) or £0 commitments
    # (min £0.99), yet £0 is a plausible answer, not a typo, so these two
    # are checked against their training maximum only.
    no_lower_range_check: ["savings_balance_gbp", "existing_monthly_obligations_gbp"]
    # Smallest change in the estimated probability of default (0.001 =
    # 0.1 percentage points) for a detail to be given as a reason or listed
    # as a risk factor or strength (Decision 34). On 1,500 held-out
    # customers the median one-at-a-time effect was 0.04 points; details
    # below this floor are model noise, and 23% of them pointed the
    # "wrong" way (3% above the floor).
    material_effect: 0.001
    # Smallest group shown in a "past customers like you" statement.
    min_group_size: 500
    # Quantile cut points for continuous features' bands.
    band_quantiles: [0.2, 0.4, 0.6, 0.8]



feature_governance:
  n_splits: 5
  n_repeats: 3
  iv_bins: 10
  psi_bins: 10
  ece_bins: 10
  xgboost_n_jobs: -1
  mlflow_artifact_path: "feature_governance/final_review"

  thresholds:
    iv_weak: 0.02
    vif_high: 5.0
    correlation_high: 0.80
    psi_moderate: 0.10
    psi_high: 0.25
    shap_low_share_pct: 0.50
    cv_pr_auc_material_delta: 0.001

threshold_recalibration:
  # Inputs for the review-capacity and cost-constrained cutoff
  # candidates (Decision 18 step 6). Neither candidate is
  # written to model.business_cutoff automatically — both feed
  # evidence into reports/threshold_selection/ for human review.
  cost_assumptions:
    # Left UNSET deliberately. Inventing a false-negative/
    # false-positive cost ratio without a defensible financial
    # basis manufactures a threshold that looks governed but
    # isn't. The expected-cost candidate is skipped with a
    # printed note until real values are supplied here. This
    # also reopens, in a narrow form, the cost-matrix approach
    # evaluate_models.py's docstring records as considered and
    # declined — log that explicitly if these get filled in.
    false_negative_cost: null
    false_positive_cost: null
  review_capacity:
    # ILLUSTRATIVE PLACEHOLDER — replace with the real manual-
    # review team capacity before this candidate is trusted.
    # 0.15 demonstrates the mechanism only ("review team can
    # handle at most 15% of applications" was an example, not
    # a confirmed operational figure).
    max_flag_rate: 0.15

champion_promotion:
  # Left UNSET deliberately, same reasoning as
  # threshold_recalibration.cost_assumptions: no promotion has
  # happened yet to calibrate a real threshold against, and
  # inventing one would manufacture a decision rule that looks
  # governed without being defensible. Until this is set,
  # promote_champion.py reports deltas but never recommends
  # promotion, regardless of how large the improvement looks.
  min_gini_delta: null
  registered_model_name: "sentinel_credit_champion"


approval_gate:
  # 48h is the one threshold in this project's governance scripts
  # that IS defaulted rather than left unset — it's derived from
  # monitor_drift_dag.py's actual @daily schedule (Decision 20),
  # not a business judgement that hasn't been made yet. Tolerates
  # one missed scheduled run before the gate refuses stale evidence.
  max_monitoring_age_hours: 48
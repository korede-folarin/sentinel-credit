
project:
  name: "Sentinel Credit — BNPL Risk Intelligence Platform"
  version: "1.0.0"

data_generator:
  n_customers: 50000
  random_seed: 42
  output_dir: "data_generator/output"

  # ── OBSERVATION WINDOWS ──────────────────────────────
  # See engineering_decision_log.md — Decision 1a.
  start_date: "2022-01-01"
  origination_end_date: "2024-10-31"
  data_end_date: "2024-12-31"

  # ── DEFAULT DEFINITION ───────────────────────────────
  # 90 DPD on the oldest unpaid instalment. CRR/EBA aligned
  # in principle. 30 DPD retained as an IFRS 9 style credit
  # risk indicator, not as default. See Decision 1a.
  default_dpd_threshold: 90
  sicr_dpd_threshold: 30

  # ── POPULATION ───────────────────────────────────────
  # Prevalences reference published UK figures. Sources and
  # reasoning in engineering_decision_log.md — Appendix A.
  vulnerability_prevalence: 0.24
  thin_file_prevalence: 0.31
  # Consumer Duty flagging only. Never a model input.
  mental_health_prevalence: 0.17

  age_distribution:
    "18-25": 0.19
    "26-35": 0.33
    "36-45": 0.23
    "46-55": 0.15
    "56+":   0.10

  age_ranges:
    "18-25": [18, 25]
    "26-35": [26, 35]
    "36-45": [36, 45]
    "46-55": [46, 55]
    "56+":   [56, 80]

  income_bands:
    "Under £15k":  0.17
    "£15k-£25k":   0.26
    "£25k-£35k":   0.24
    "£35k-£50k":   0.18
    "£50k-£75k":   0.10
    "Over £75k":   0.05

  merchant_categories:
    "Fashion & Clothing": 0.30
    "Electronics":        0.17
    "Home":               0.15
    "Health & Beauty":    0.12
    "Sports":             0.10
    "Travel":             0.07
    "Food & Grocery":     0.06
    "Other":              0.03

  # Range anchored to a published delinquency spread.
  merchant_risk:
    "Food & Grocery":     0.50
    "Health & Beauty":    0.65
    "Sports":             0.80
    "Other":              1.00
    "Home":               1.20
    "Fashion & Clothing": 1.50
    "Electronics":        2.00
    "Travel":             2.50

  # ── INSTALMENT PLANS ─────────────────────────────────
  # Pay in 3 plus 6 and 12 month plans. Category split is a
  # design assumption, loose not deterministic. Decision 1a.
  instalment_plans_by_category:
    "Home":               {3: 0.70, 6: 0.20, 12: 0.10}
    "Electronics":        {3: 0.75, 6: 0.17, 12: 0.08}
    "Travel":             {3: 0.80, 6: 0.14, 12: 0.06}
    "Fashion & Clothing": {3: 0.95, 6: 0.04, 12: 0.01}
    "Health & Beauty":    {3: 0.96, 6: 0.03, 12: 0.01}
    "Sports":             {3: 0.94, 6: 0.05, 12: 0.01}
    "Other":              {3: 0.93, 6: 0.05, 12: 0.02}
    # Essentials capped at Pay in 3 per Woolard Review.
    "Food & Grocery":     {3: 1.00}

  # ── REPAYMENT HAZARD PROCESS ─────────────────────────
  # Default emerges from repayment behaviour, never assigned.
  # Values calibrated by sweep. See Decision 1a.
  repayment_process:
      
    base_miss_hazard: 0.005

    # Calibration multiplier on the arrears cure probabilities.
    cure_scale: 1.30

    # Capacity to recover, distinct from likelihood of missing.
    resilience_weights:
      savings_buffer:            0.45
      disposable_income_buffer:  0.40
      employment_stability:      0.15

    # Arrears depth: [full_cure, partial_cure, no_payment]
    arrears_resolution:
      1: [0.75, 0.00, 0.25]
      2: [0.35, 0.40, 0.25]
      3: [0.12, 0.55, 0.33]
      4: [0.04, 0.56, 0.40]

    # Cure chances halve every N days the oldest arrear ages.
    dpd_decay_halflife: 45

    # Payments clear the oldest unpaid instalment first.
    payment_allocation: "oldest_due_first"

  # ── A/B TEST ─────────────────────────────────────────
  # Strict 0.45 vs relaxed 0.60 affordability threshold.
  # Uplift powered for 80% at 5% significance. Decision 1.
  ab_test:
    group_A_size:           0.50
    group_B_size:           0.50
    # Group B approves at a looser affordability threshold,
    # so its customers miss payments more often. Applied to
    # the miss hazard, since default is emergent rather than
    # assigned. Calibrated to produce a detectable difference.
    group_B_hazard_multiplier: 1.60
    strict_threshold:       0.45
    relaxed_threshold:      0.60


validation:
  # ── FIDELITY ──────────────────────────────────────────
 
  hellinger_threshold: 0.05

  
  prevalence_tolerance: 0.01

  # ── UTILITY ───────────────────────────────────────────
 
  gini_tolerance: 0.05

  # ── PRIVACY ───────────────────────────────────────────

  singling_out_threshold: 0.20     # max acceptable unique-record rate
  near_duplicate_threshold: 0.01   # max acceptable near-duplicate rate

  # ── PLANNED, NOT YET IMPLEMENTED ──────────────────────

  n_runs: 5
  ks_threshold: 0.05

  reports_dir: "validation/reports"

eda_thresholds:
  # Standard credit-scoring convention (Siddiqi, Credit Risk
  # Scorecards), not derived from this dataset — unlike
  # hellinger_threshold, which is anchored to observed scores.
  # IV < 0.02 no signal; 0.02-0.3 usable; > 0.5 investigate
  # for leakage before including the feature.
  iv_drop_threshold: 0.02
  iv_leakage_threshold: 0.50

  # Conventional multicollinearity flag for regression models.
  vif_threshold: 10.0

  # Flags feature pairs worth reviewing before modelling.
  correlation_threshold: 0.70

  # Standard Tukey IQR multiplier for outlier flagging.
  outlier_iqr_multiplier: 1.5


database:
  # PostgreSQL connection details. Password is never stored
  # here — read from the SENTINEL_DB_PASSWORD environment
  # variable at runtime (see eda_baseline.py / eda_exploration.ipynb).
  host: "localhost"
  port: 5432
  name: "sentinel_credit"
  schema: "feature_store"

model:
  test_size: 0.2
  random_seed: 42

  # Business cutoff is treated as a configurable POLICY
  # parameter belonging to the decision engine, not as a
  # property of any individual algorithm. The model produces a
  # risk score; the business decides where the line sits.
  #
  # Calibrated for this benchmark against the champion model
  # (XGBoost, F1-optimal 0.1449 at Gini 0.6493 / KS 0.5061 on
  # the corrected population). NOT set by averaging across
  # models — a midpoint between per-model optima has no
  # engineering justification (it is neither F1-optimal,
  # expected-loss optimal, nor policy-derived).
  #
  # Future champion-challenger promotion (Decision 8) requires
  # threshold RECALIBRATION as part of promotion — the cutoff
  # is not transferable across models, since each model's score
  # distribution differs. See docs/engineering_decision_log.md.
  business_cutoff: 0.137

  # Temporal split currently produces a degenerate single-class
  # test set under the corrected has_outcome logic (16/16
  # positive at this date) and is skipped automatically by
  # train_baseline_models.py. Retained in config for the
  # documented future-work fix, not currently usable.
  # See Decision 10 addendum (tenor-maturity bias).
  split_strategy: "temporal"
  temporal_split_date: "2024-09-01"